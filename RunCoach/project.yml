name: RunCoach
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  bundleIdPrefix: com.runcoach
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # fill in your Apple Developer Team ID

targets:
  RunCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunCoach
        excludes:
          - "**/*.md"
    info:
      path: RunCoach/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: RunCoach
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runcoach.app
        INFOPLIST_FILE: RunCoach/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: RunCoach/RunCoach.entitlements
      properties: {}

  RunCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunCoachTests
    dependencies:
      - target: RunCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runcoach.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RunCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RunCoach"
